<body>

            <nav class="main-nav">
                <ul class="nav-links">

            <a href="contact.html" class="nav-cta active">Book a consultation <span class="nav-cta-arrow">↗</span></a>
        </div>
    </header>
    
    <main style="padding: 8rem 0; background-color: var(--bg-page);">
        <section class="contact">
            <div class="container">
                <div class="contact-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem;">
                    
                    <div class="contact-info">
                        <div class="contact-details" style="margin-bottom: 2rem;">
                            <span class="label-pill">Get in touch</span>
                            <h2 style="font-size: 3rem; color: var(--text-dark); margin-bottom: 0.5rem; font-family: var(--font-serif);">Michael Risser</h2>
                            <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">Associate Broker</p>
                            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                                <p class="phone" style="font-size: 1.25rem; color: var(--text-dark);">Call/Text: <a href="tel:+16103487654" style="color: var(--accent); font-weight: 600;">(610) 348-7654</a></p>
                                <p class="email" style="font-size: 1.25rem; color: var(--text-dark);">Email: <a href="mailto:mike@michaelrisser.com" style="color: var(--accent); font-weight: 600;">mike@michaelrisser.com</a></p>
                                <p class="address" style="font-size: 1.1rem; color: var(--text-dark); line-height: 1.6; margin-top: 0.5rem;"><strong>Office Address:</strong><br>941 N Providence Rd<br>Media, PA 19063</p>
                            </div>
                        </div>
                        <div class="map-container" style="border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm);">
                            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d195600.32014022802!2d-75.6026419!3d40.002824!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c6f62b291a1a67%3A0xc3b832b84eb47706!2sChester%20County%2C%20PA!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" style="width: 100%; height: 300px; border: 0;"></iframe>
                        </div>
                    </div>

                    <div class="contact-form-container">
                        <h2 style="font-family: var(--font-serif); color: var(--text-dark); margin-bottom: 1.5rem; font-size: 2rem;">Let's Talk Real Estate</h2>
                        <form id="leadForm" action="php/submit.php" method="POST" style="background: var(--bg-white); padding: 2.5rem; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);">
                            <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                                <div class="form-group">
                                    <label for="first_name" style="color: var(--text-dark); font-weight: 500; display: block; margin-bottom: 0.5rem;">First Name</label>
                                    <input type="text" id="first_name" name="first_name" placeholder="e.g. John" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-sans);">
                                </div>
                                <div class="form-group">
                                    <label for="last_name" style="color: var(--text-dark); font-weight: 500; display: block; margin-bottom: 0.5rem;">Last Name</label>
                                    <input type="text" id="last_name" name="last_name" placeholder="e.g. Doe" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-sans);">
                                </div>
                            </div>
                            <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                                <div class="form-group">
                                    <label for="phone" style="color: var(--text-dark); font-weight: 500; display: block; margin-bottom: 0.5rem;">Phone Number</label>
                                    <input type="tel" id="phone" name="phone" class="us-phone-input" placeholder="e.g. 123-456-7890" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-sans);">
                                </div>
                                <div class="form-group">
                                    <label for="email" style="color: var(--text-dark); font-weight: 500; display: block; margin-bottom: 0.5rem;">Email Address</label>
                                    <input type="email" id="email" name="email" placeholder="e.g. john@example.com" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-sans);">
                                </div>
                            </div>
                            <div class="form-group" style="margin-bottom: 1.5rem;">
                                <label for="inquiry_type" style="color: var(--text-dark); font-weight: 500; display: block; margin-bottom: 0.5rem;">How can I help you?</label>
                                <select id="inquiry_type" name="inquiry_type" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-sans); background: var(--bg-white);">
                                    <option value="" disabled selected>Select an option...</option>
                                    <option value="buying">Buying a Home</option>
                                    <option value="selling">Selling a Home</option>
                                    <option value="evaluation">Free Home Evaluation</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="checkbox-group" style="margin-bottom: 1.5rem; display: flex; align-items: flex-start; gap: 0.5rem;">
                                <input type="checkbox" id="compliance_opt_in" name="compliance_opt_in" required style="margin-top: 0.25rem;">
                                <label for="compliance_opt_in" class="compliance-text" style="color: var(--text-muted); font-size: 0.8rem; line-height: 1.4;">By checking this box, I agree by electronic signature to the Electronic Disclosure Consent Agreement; to receive recurring marketing communication from Michael Risser, including auto-dialed calls, texts, and artificial/prerecorded voice messages (message frequency varies; data rates may apply; reply "STOP" to opt-out of texts or "HELP" for assistance); and to the Terms of Service and Privacy Policy of this website. Consent not required to make a purchase. I understand that I can call 610-348-7654 to obtain direct assistance.</label>
                            </div>

                            <!-- Turnstile Widget -->
                            <div class="cf-turnstile" data-sitekey="0x4AAAAAAAi84uM0oR-m0YXX" data-theme="light" data-appearance="interaction-only" style="position: absolute; opacity: 0; pointer-events: none;"></div>

                            <button type="submit" class="btn-dark" style="width: 100%; justify-content: center;">Submit Inquiry <span>↗</span></button>
                        </form>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <div id="global-footer-container"></div>
    <script src="script.js"></script>
</body>
</html>
